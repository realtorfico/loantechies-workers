name = "softician-api-keepalive"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Cron trigger: fire every 5 minutes (UTC, 24/7). Each run pings the backend's /api/health so the
# Azure Functions host stays warm and the public site's first rate/estimate request avoids a cold
# start. Workers cron invocations are free-tier friendly (~8,640/month, well within limits).
[triggers]
crons = ["*/5 * * * *"]

# The endpoint to keep warm. Overridable without editing code via:  wrangler secret / var.
[vars]
HEALTH_URL = "https://softician-api.azurewebsites.net/api/health"
